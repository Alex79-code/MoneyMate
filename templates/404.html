<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - MoneyMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            color: #1f2937;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="error-code">
            404
        </div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for doesn't exist.
        </p>

        <a href="{{ url_for('dashboard') }}" class="home-btn">
            Go to Dashboard
        </a>

    </div>

</body>
</html>
