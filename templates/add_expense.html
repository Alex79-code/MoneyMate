<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - MoneyMate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #b91c1c;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">💰 MoneyMate</div>

        <a href="{{ url_for('dashboard') }}" class="back-link">
            ← Dashboard
        </a>
    </div>

    <div class="container">

        <div class="card">

            <h1>➖ Add Expense</h1>

            <p class="subtitle">
                Record your spending and keep track of your money.
            </p>

            <form method="POST">

                <label for="category">
                    Expense Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >
                    <option value="">Select a category</option>

                    <option value="Food">
                        🍔 Food
                    </option>

                    <option value="Transport">
                        🚗 Transport
                    </option>

                    <option value="Rent">
                        🏠 Rent
                    </option>

                    <option value="Shopping">
                        🛒 Shopping
                    </option>

                    <option value="Bills">
                        💡 Bills
                    </option>

                    <option value="Education">
                        🎓 Education
                    </option>

                    <option value="Health">
                        ❤️ Health
                    </option>

                    <option value="Entertainment">
                        🎮 Entertainment
                    </option>

                    <option value="Other">
                        📦 Other
                    </option>
                </select>

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0"
                    placeholder="Enter expense amount"
                    required
                >

                <label for="expense_date">
                    Date
                </label>

                <input
                    type="date"
                    id="expense_date"
                    name="expense_date"
                    required
                >

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Example: Lunch at college"
                ></textarea>

                <button
                    type="submit"
                    class="button"
                >
                    Add Expense
                </button>

            </form>

        </div>

    </div>

</body>
</html>
