<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income - MoneyMate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f6fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000010;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #15803d;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💰 Add Income</h1>

        <form method="POST">

            <label for="source">Income Source</label>

            <input
                type="text"
                id="source"
                name="source"
                placeholder="Example: Salary"
                required
            >


            <label for="amount">Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Example: 25000"
                step="0.01"
                min="0"
                required
            >


            <label for="income_date">Date</label>

            <input
                type="date"
                id="income_date"
                name="income_date"
                required
            >


            <label for="description">Description</label>

            <input
                type="text"
                id="description"
                name="description"
                placeholder="Example: September salary"
            >


            <button type="submit">
                Save Income
            </button>

        </form>

        <a href="/dashboard" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
