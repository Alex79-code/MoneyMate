<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget - MoneyMate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #007bff;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>MoneyMate</h2>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>
    </div>

    <div class="container">

        <h1>💰 Monthly Budget</h1>

        <p class="subtitle">
            Set your budget for a month
        </p>

        <form method="POST">

            <label for="month_year">
                Select Month
            </label>

            <input
                type="month"
                id="month_year"
                name="month_year"
                required
            >

            <label for="budget_amount">
                Budget Amount
            </label>

            <input
                type="number"
                id="budget_amount"
                name="budget_amount"
                placeholder="Enter budget amount"
                step="0.01"
                min="0.01"
                required
            >

            <button type="submit">
                Save Budget
            </button>

        </form>

        <a
            href="{{ url_for('dashboard') }}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
