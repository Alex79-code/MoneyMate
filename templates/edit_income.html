<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Income - MoneyMate</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Edit Income</h1>

        <form method="POST">

            <!-- Income Source -->

            <label for="source">
                Income Source
            </label>

            <input
                type="text"
                id="source"
                name="source"
                value="{{ income[0] }}"
                required
            >

            <!-- Amount -->

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                value="{{ income[1] }}"
                step="0.01"
                min="0.01"
                required
            >

            <!-- Date -->

            <label for="income_date">
                Income Date
            </label>

            <input
                type="date"
                id="income_date"
                name="income_date"
                value="{{ income[2] }}"
                required
            >

            <!-- Description -->

            <label for="description">
                Description
            </label>

            <input
                type="text"
                id="description"
                name="description"
                value="{{ income[3] or '' }}"
            >

            <!-- Update -->

            <button type="submit">
                Update Income
            </button>

        </form>

        <a
            href="{{ url_for('dashboard') }}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
